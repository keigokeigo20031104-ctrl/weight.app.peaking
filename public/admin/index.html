<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weight Admin</title>
<style>
:root{--bg:#f5f6f2;--ink:#17211f;--muted:#65726e;--line:#d8dfdb;--card:#fff;--accent:#176b5d;--soft:#e3f2ee;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1100px;margin:auto;padding:18px 12px 80px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}h1,h2{margin:0 0 10px}button,input,textarea,select{font:inherit;border-radius:10px;padding:9px}button{border:0;background:var(--accent);color:white;font-weight:800}button.secondary{background:#eef2ef;color:var(--ink);border:1px solid var(--line)}button.danger{background:var(--danger)}input,textarea,select{border:1px solid var(--line);width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.users{display:flex;gap:6px;flex-wrap:wrap}.userbtn{background:var(--soft);color:var(--accent)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#f7faf8;border:1px solid var(--line);border-radius:14px;padding:10px}.stat b{font-size:22px;display:block}.muted{color:var(--muted)}.tabs{position:fixed;left:0;right:0;bottom:0;background:#ffffffdd;border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px}.tabs a{text-decoration:none;color:var(--muted);font-weight:800;font-size:12px;padding:8px 12px;border-radius:999px}.tabs a.active{background:var(--soft);color:var(--accent)}
@media(min-width:800px){.stats{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="app">
<header><h1>体重ログ 管理</h1><p class="muted">サーバー取得した記録、意見箱、お知らせを確認</p></header>
<section class="card" id="profile"><h2>管理者プロフィール設定</h2><label>管理者名 *</label><input id="adminName" placeholder="管理者名"><label>役職・説明（任意）</label><input id="adminDesc"><button id="saveProfile">保存して開始</button></section>
<section class="card" id="server"><h2>サーバー上の記録</h2><div class="row"><button id="fetchRecords">サーバーから最新取得</button><button class="secondary" id="loadLocal">ローカル再表示</button><button class="danger" id="deleteUser">選択中の入力者を削除</button></div><p id="serverMsg" class="muted">記録を取得していません。</p></section>
<section class="card" id="users"><h2>入力者</h2><div class="users" id="userList"></div></section>
<section class="card" id="summary"><h2>個別記録</h2><div class="stats"><div class="stat"><span>最新体重</span><b id="latest">-- kg</b></div><div class="stat"><span>7日変化</span><b id="diff7">--</b></div><div class="stat"><span>30日変化</span><b id="diff30">--</b></div><div class="stat"><span>平均摂取</span><b id="avgCal">--</b></div></div></section>
<section class="card" id="notice"><h2>お知らせを投稿</h2><input id="noticeTitle" placeholder="タイトル（任意）"><textarea id="noticeContent" placeholder="内容 *"></textarea><input id="noticeBy" placeholder="投稿者名（任意）"><button id="postNotice">投稿する</button><h2>投稿済みお知らせ</h2><div id="noticeList" class="muted">読み込み中…</div></section>
<section class="card" id="feedback"><h2>意見箱</h2><div class="row"><button id="fetchFeedback">再読み込み</button><select id="fbFilter"><option>すべて</option><option>バグ報告</option><option>機能要望</option><option>その他</option><option>未読のみ</option></select></div><div id="feedbackList" class="muted">読み込み中…</div></section>
<section class="card" id="records"><h2>記録一覧</h2><table><thead><tr><th>日付</th><th>体重</th><th>摂取kcal</th><th>食事</th><th>トレーニング</th><th>メモ</th><th>学年</th><th>カテゴリ</th></tr></thead><tbody id="recordRows"></tbody></table></section>
</div><nav class="tabs"><a href="#server" class="active">ホーム</a><a href="#users">入力者</a><a href="#feedback">意見</a><a href="#notice">お知らせ</a></nav>
<script>
const $=id=>document.getElementById(id);let store=JSON.parse(localStorage.getItem("weight-admin-v1")||'{"records":[],"profile":{},"selected":""}');
function save(){localStorage.setItem("weight-admin-v1",JSON.stringify(store))}
function byUser(){return [...new Set(store.records.map(r=>r.user||"unknown"))].sort((a,b)=>a.localeCompare(b,"ja"))}
function currentRecords(){return store.records.filter(r=>!store.selected || r.user===store.selected).sort((a,b)=>a.date.localeCompare(b.date))}
function volume(t=[]){return t.reduce((s,i)=>s+(i.sets||[]).reduce((a,b)=>a+(Number(b.weight)||0)*(Number(b.reps)||0),0),0)}
function render(){
 $("adminName").value=store.profile.name||"";$("adminDesc").value=store.profile.desc||"";
 const users=byUser(); $("userList").innerHTML=users.map(u=>`<button class="userbtn" data-u="${u}">${u}</button>`).join("")||'<p class="muted">サーバーから記録を取得すると入力者を選べます。</p>';
 document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{store.selected=b.dataset.u;save();render();});
 const rows=currentRecords(); const latest=rows.at(-1); $("latest").textContent=latest?latest.weight+" kg":"-- kg";
 function diff(days){if(rows.length<2)return"--";const end=new Date(rows.at(-1).date);const recent=rows.filter(r=>(end-new Date(r.date))/86400000<days);return recent.length>=2?(Number(recent.at(-1).weight)-Number(recent[0].weight)).toFixed(1)+" kg":"--"}
 $("diff7").textContent=diff(7);$("diff30").textContent=diff(30);const c=rows.map(r=>Number(r.calories)).filter(Number.isFinite);$("avgCal").textContent=c.length?Math.round(c.reduce((a,b)=>a+b,0)/c.length)+" kcal":"--";
 $("recordRows").innerHTML=rows.reverse().map(r=>`<tr><td>${r.date}</td><td>${r.weight}</td><td>${r.calories??""}</td><td>${(r.meals||[]).map(m=>`${m.time||""} ${m.text||""}`).join("<br>")}</td><td>${(r.training||[]).map(t=>`${t.exercise||""} ${volume([t]).toFixed(1)}`).join("<br>")}</td><td>${r.note||""}</td><td>${r.grade||""}</td><td>${r.category||""}</td></tr>`).join("");
}
$("saveProfile").onclick=()=>{store.profile={name:$("adminName").value,desc:$("adminDesc").value};save();alert("保存しました")};
$("fetchRecords").onclick=async()=>{try{const res=await fetch("/api/records?consume=1");const data=await res.json();if(!res.ok)throw new Error(data.error);store.records=[...store.records,...(data.records||[])];save();$("serverMsg").textContent=`${data.records?.length||0}件取得しました`;render();}catch(e){$("serverMsg").textContent="取得できませんでした: "+e.message}};
$("loadLocal").onclick=render;$("deleteUser").onclick=()=>{if(!store.selected)return; if(confirm(store.selected+"を削除しますか？")){store.records=store.records.filter(r=>r.user!==store.selected);store.selected="";save();render();}};
$("postNotice").onclick=async()=>{try{const body={title:$("noticeTitle").value,content:$("noticeContent").value,postedBy:$("noticeBy").value||store.profile.name};const res=await fetch("/api/notice",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!res.ok)throw new Error();alert("投稿しました");fetchNotices();}catch{alert("投稿できませんでした")}};
async function fetchNotices(){try{const d=await (await fetch("/api/notice")).json();$("noticeList").innerHTML=(d.notices||[]).map(n=>`<div><b>${n.title||"お知らせ"}</b><br>${n.content}<br><small>${n.postedBy||""} ${n.postedAt}</small></div><hr>`).join("")||"なし"}catch{$("noticeList").textContent="取得できませんでした"}}
$("fetchFeedback").onclick=fetchFeedback;$("fbFilter").onchange=fetchFeedback;
async function fetchFeedback(){try{const d=await (await fetch("/api/user-feedback")).json();let items=d.feedbacks||[];const f=$("fbFilter").value;if(f==="未読のみ")items=items.filter(x=>!x.read);else if(f!=="すべて")items=items.filter(x=>x.category===f);$("feedbackList").innerHTML=items.map(x=>`<div><b>${x.category}</b> ${x.senderName||"匿名"}<br>${x.message}<br><small>${x.sentAt}</small></div><hr>`).join("")||"なし"}catch{$("feedbackList").textContent="取得できませんでした"}}
document.querySelectorAll(".tabs a").forEach(a=>a.onclick=()=>document.querySelectorAll(".tabs a").forEach(x=>x.classList.toggle("active",x===a)));
render();fetchNotices();fetchFeedback();
</script></body></html>
