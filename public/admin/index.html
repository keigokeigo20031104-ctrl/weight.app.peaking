<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>体重ログ 管理</title>
  <style>
    :root {
      --bg: #f5f6f2; --ink: #17211f; --muted: #65726e; --line: #d8dfdb;
      --card: #fff; --accent: #176b5d; --soft: #e3f2ee; --danger: #b42318;
      --shadow: 0 12px 30px rgba(25,39,36,.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; line-height: 1.5; }
    .app { max-width: 1080px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 80px); }

    /* ── ヘッダー ── */
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 28px; font-weight: 900; line-height: 1.1; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .badge { flex-shrink: 0; background: var(--soft); color: var(--accent); font-size: 11px; font-weight: 800; padding: 5px 10px; border-radius: 999px; margin-top: 4px; }

    /* ── カード ── */
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
    h2 { margin: 0 0 12px; font-size: 17px; font-weight: 800; }

    /* ── フォーム ── */
    label { display: block; font-size: 12px; font-weight: 800; color: var(--muted); margin: 10px 0 4px; }
    label:first-child { margin-top: 0; }
    input, textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fbfcfb; color: var(--ink); font: inherit; min-height: 42px; }
    textarea { min-height: 80px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(23,107,93,.12); }

    /* ── ボタン ── */
    button { min-height: 42px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; white-space: nowrap; }
    button.secondary { background: #eef2ef; color: var(--ink); border: 1px solid var(--line); }
    button.danger { background: var(--danger); color: #fff; }
    button:disabled { opacity: .6; cursor: default; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    /* ── 統計グリッド ── */
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat { background: #f7faf8; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
    .stat span { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
    .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; margin-top: 2px; }

    /* ── ユーザーボタン ── */
    .users { display: flex; gap: 8px; flex-wrap: wrap; }
    .userbtn { background: var(--soft); color: var(--accent); font-size: 13px; min-height: 36px; padding: 0 12px; }
    .userbtn.selected { background: var(--accent); color: #fff; }

    /* ── お知らせアイテム ── */
    .notice-item { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 10px; background: #fbfcfb; }
    .notice-item h3 { margin: 0 0 4px; font-size: 15px; }
    .notice-meta { color: var(--muted); font-size: 12px; margin-top: 8px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }

    /* ── 意見箱アイテム ── */
    .fb-item { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 10px; background: #fbfcfb; }
    .fb-item.unread { background: #f0faf7; border-color: rgba(23,107,93,.3); }
    .fb-header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
    .fb-cat { background: var(--soft); color: var(--accent); font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; }
    .fb-new { background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px; }
    .fb-msg { font-size: 14px; margin: 4px 0; line-height: 1.6; }
    .fb-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .fb-footer small { color: var(--muted); font-size: 12px; }
    .sm-btn { min-height: 32px !important; font-size: 12px !important; padding: 0 10px !important; }

    /* ── テーブル ── */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 620px; }
    th { background: #f0f2f0; font-weight: 800; color: var(--muted); white-space: nowrap; }
    th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
    tr:last-child td { border-bottom: 0; }

    /* ── タブ ── */
    .tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 6px 8px calc(env(safe-area-inset-bottom) + 6px); gap: 2px; z-index: 100; }
    .tabs a { flex: 1; max-width: 88px; text-align: center; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 800; padding: 8px 2px; border-radius: 10px; line-height: 1.2; }
    .tabs a.active { background: var(--soft); color: var(--accent); }

    /* ── タブパネル ── */
    .tab-panel[hidden] { display: none; }

    /* ── ユーティリティ ── */
    .muted { color: var(--muted); }
    .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
    .status-msg { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
    .mt { margin-top: 12px; }

    @media (min-width: 800px) {
      .stats { grid-template-columns: repeat(4, 1fr); }
      .app { padding-left: 20px; padding-right: 20px; }
    }
    @media (max-width: 440px) {
      .app { padding-left: 12px; padding-right: 12px; }
      .card { padding: 14px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>体重ログ 管理</h1>
      <p class="subtitle">サーバー取得した記録、意見箱、お知らせを確認</p>
    </div>
    <span class="badge">管理者画面</span>
  </header>

  <!-- ホームタブ -->
  <div class="tab-panel" id="tab-home">
    <section class="card">
      <h2>管理者プロフィール設定</h2>
      <label>管理者名 *</label>
      <input id="adminName" placeholder="例: 田中コーチ">
      <label>役職・説明（任意）</label>
      <input id="adminDesc" placeholder="例: トレーニング担当">
      <div class="mt"><button id="saveProfile">保存して開始</button></div>
    </section>
    <section class="card">
      <h2>サーバー上の記録</h2>
      <div class="row">
        <button id="fetchRecords">サーバーから最新取得</button>
        <button class="secondary" id="loadLocal">ローカル再表示</button>
      </div>
      <p id="serverMsg" class="status-msg">記録を取得していません。</p>
    </section>
  </div>

  <!-- 記録タブ -->
  <div class="tab-panel" id="tab-records" hidden>
    <section class="card">
      <h2>記録一覧</h2>
      <p class="hint">入力者タブで選択すると絞り込めます。</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>日付</th><th>体重</th><th>kcal</th><th>食事</th><th>トレーニング</th><th>メモ</th><th>学年</th><th>カテゴリ</th></tr>
          </thead>
          <tbody id="recordRows"></tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- 入力者タブ -->
  <div class="tab-panel" id="tab-users" hidden>
    <section class="card">
      <h2>入力者</h2>
      <div class="users" id="userList"></div>
      <div class="mt">
        <button class="danger" id="deleteUser">選択中の入力者を削除</button>
      </div>
    </section>
    <section class="card">
      <h2>個別記録サマリー</h2>
      <div class="stats">
        <div class="stat"><span>最新体重</span><b id="latest">-- kg</b></div>
        <div class="stat"><span>7日変化</span><b id="diff7">--</b></div>
        <div class="stat"><span>30日変化</span><b id="diff30">--</b></div>
        <div class="stat"><span>平均摂取</span><b id="avgCal">--</b></div>
      </div>
    </section>
  </div>

  <!-- お知らせタブ -->
  <div class="tab-panel" id="tab-notice" hidden>
    <section class="card">
      <h2>お知らせを投稿</h2>
      <label>タイトル</label>
      <input id="noticeTitle" placeholder="タイトル（任意）">
      <label>内容 *</label>
      <textarea id="noticeContent" placeholder="お知らせの内容を入力してください"></textarea>
      <label>投稿者名</label>
      <input id="noticeBy" placeholder="投稿者名（任意）">
      <div class="mt"><button id="postNotice">📢 投稿する</button></div>
      <p id="noticePostStatus" class="hint"></p>
    </section>
    <section class="card">
      <h2>投稿済みお知らせ</h2>
      <div id="noticeList"><p class="hint">読み込み中…</p></div>
    </section>
  </div>

  <!-- 意見箱タブ -->
  <div class="tab-panel" id="tab-feedback" hidden>
    <section class="card">
      <h2>意見箱</h2>
      <div class="row" style="margin-bottom:12px">
        <button class="secondary" id="fetchFeedback">再読み込み</button>
        <select id="fbFilter" style="flex:1;max-width:180px;min-height:42px">
          <option>すべて</option><option>バグ報告</option><option>機能要望</option><option>その他</option><option>未読のみ</option>
        </select>
      </div>
      <div id="feedbackList"><p class="hint">読み込み中…</p></div>
    </section>
  </div>
</div>

<nav class="tabs">
  <a href="#home">ホーム</a>
  <a href="#records">記録</a>
  <a href="#users">入力者</a>
  <a href="#notice">お知らせ</a>
  <a href="#feedback">意見箱</a>
</nav>

<script>
  const $ = id => document.getElementById(id);
  let store = JSON.parse(localStorage.getItem("weight-admin-v1") || '{"records":[],"profile":{},"selected":""}');

  function save() { localStorage.setItem("weight-admin-v1", JSON.stringify(store)); }
  function byUser() { return [...new Set(store.records.map(r => r.user || "unknown"))].sort((a, b) => a.localeCompare(b, "ja")); }
  function currentRecords() { return store.records.filter(r => !store.selected || r.user === store.selected).sort((a, b) => a.date.localeCompare(b.date)); }
  function volume(t = []) { return t.reduce((s, i) => s + (i.sets || []).reduce((a, b) => a + (Number(b.weight) || 0) * (Number(b.reps) || 0), 0), 0); }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function fmtDate(iso) {
    try { const d = new Date(iso); return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
    catch { return iso || ""; }
  }

  // ── タブ切り替え ──
  const TAB_MAP = { home: "tab-home", records: "tab-records", users: "tab-users", notice: "tab-notice", feedback: "tab-feedback" };
  function showTab(hash) {
    const key = (hash || "#home").replace("#", "");
    const targetId = TAB_MAP[key] || "tab-home";
    document.querySelectorAll(".tab-panel").forEach(p => { p.hidden = true; });
    const panel = document.getElementById(targetId);
    if (panel) panel.hidden = false;
    document.querySelectorAll(".tabs a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + key));
    history.replaceState(null, "", "#" + key);
  }
  document.querySelectorAll(".tabs a").forEach(a => {
    a.addEventListener("click", e => {
      e.preventDefault();
      const h = a.getAttribute("href");
      showTab(h);
      if (h === "#notice") fetchNotices();
      if (h === "#feedback") fetchFeedback();
    });
  });
  window.addEventListener("hashchange", () => showTab(location.hash));

  // ── render ──
  function render() {
    $("adminName").value = store.profile.name || "";
    $("adminDesc").value = store.profile.desc || "";

    const users = byUser();
    $("userList").innerHTML = users.map(u =>
      `<button class="userbtn${store.selected === u ? " selected" : ""}" data-u="${esc(u)}">${esc(u)}</button>`
    ).join("") || '<p class="muted" style="font-size:13px">サーバーから記録を取得すると入力者を選べます。</p>';
    document.querySelectorAll("[data-u]").forEach(b => b.onclick = () => { store.selected = b.dataset.u; save(); render(); });

    const rows = currentRecords();
    const latest = rows.at(-1);
    $("latest").textContent = latest ? latest.weight + " kg" : "-- kg";
    function diff(days) {
      if (rows.length < 2) return "--";
      const end = new Date(rows.at(-1).date);
      const recent = rows.filter(r => (end - new Date(r.date)) / 86400000 < days);
      return recent.length >= 2 ? (Number(recent.at(-1).weight) - Number(recent[0].weight)).toFixed(1) + " kg" : "--";
    }
    $("diff7").textContent = diff(7);
    $("diff30").textContent = diff(30);
    const cals = rows.map(r => Number(r.calories)).filter(Number.isFinite);
    $("avgCal").textContent = cals.length ? Math.round(cals.reduce((a, b) => a + b, 0) / cals.length) + " kcal" : "--";

    $("recordRows").innerHTML = [...rows].reverse().map(r =>
      `<tr>
        <td style="white-space:nowrap">${esc(r.date)}</td>
        <td>${esc(String(r.weight || ""))}</td>
        <td>${r.calories ?? ""}</td>
        <td style="max-width:130px">${(r.meals || []).map(m => esc((m.time || "") + " " + (m.text || ""))).join("<br>")}</td>
        <td style="max-width:150px">${(r.training || []).map(t => esc((t.exercise || "") + " " + volume([t]).toFixed(1))).join("<br>")}</td>
        <td style="max-width:120px">${esc(r.note || "")}</td>
        <td>${esc(r.grade || "")}</td>
        <td>${esc(r.category || "")}</td>
      </tr>`
    ).join("");
  }

  // ── プロフィール保存 ──
  $("saveProfile").onclick = () => {
    store.profile = { name: $("adminName").value.trim(), desc: $("adminDesc").value.trim() };
    save();
    const btn = $("saveProfile");
    btn.textContent = "✓ 保存しました";
    setTimeout(() => { btn.textContent = "保存して開始"; }, 1500);
  };

  // ── 記録取得 ──
  $("fetchRecords").onclick = async () => {
    const btn = $("fetchRecords");
    btn.disabled = true; btn.textContent = "取得中…";
    try {
      const res = await fetch("/api/records?consume=1");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      store.records = [...store.records, ...(data.records || [])];
      save();
      $("serverMsg").textContent = `${data.records?.length || 0} 件取得しました`;
      render();
    } catch (e) {
      $("serverMsg").textContent = "取得できませんでした: " + e.message;
    } finally {
      btn.disabled = false; btn.textContent = "サーバーから最新取得";
    }
  };
  $("loadLocal").onclick = () => { render(); $("serverMsg").textContent = "ローカルデータを表示しました。"; };

  $("deleteUser").onclick = () => {
    if (!store.selected) { alert("入力者を選択してください"); return; }
    if (confirm(store.selected + " の記録をすべて削除しますか？")) {
      store.records = store.records.filter(r => r.user !== store.selected);
      store.selected = "";
      save(); render();
    }
  };

  // ── お知らせ投稿 ──
  $("postNotice").onclick = async () => {
    const btn = $("postNotice");
    const content = $("noticeContent").value.trim();
    if (!content) { $("noticePostStatus").textContent = "内容を入力してください。"; return; }
    btn.disabled = true; btn.textContent = "投稿中…";
    $("noticePostStatus").textContent = "";
    try {
      const res = await fetch("/api/notice", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: $("noticeTitle").value.trim(), content, postedBy: $("noticeBy").value.trim() || store.profile.name })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      $("noticeTitle").value = ""; $("noticeContent").value = ""; $("noticeBy").value = "";
      $("noticePostStatus").textContent = "投稿しました。";
      fetchNotices();
    } catch (e) {
      $("noticePostStatus").textContent = "投稿できませんでした: " + e.message;
    } finally {
      btn.disabled = false; btn.textContent = "📢 投稿する";
    }
  };

  async function fetchNotices() {
    try {
      const d = await (await fetch("/api/notice")).json();
      const notices = d.notices || [];
      $("noticeList").innerHTML = notices.length
        ? notices.map(n => `
          <div class="notice-item">
            <h3>${esc(n.title || "お知らせ")}</h3>
            <p style="margin:4px 0;font-size:14px;line-height:1.6">${esc(n.content)}</p>
            <div class="notice-meta">
              <span>${esc(n.postedBy || "")}${n.postedBy ? " · " : ""}${fmtDate(n.postedAt)}</span>
              <button class="danger sm-btn" data-del-notice="${esc(n.id)}">削除</button>
            </div>
          </div>`).join("")
        : '<p class="hint">投稿済みのお知らせはありません。</p>';
      document.querySelectorAll("[data-del-notice]").forEach(btn => {
        btn.onclick = async () => {
          if (!confirm("このお知らせを削除しますか？")) return;
          btn.disabled = true;
          try {
            await fetch(`/api/notice?id=${encodeURIComponent(btn.dataset.delNotice)}`, { method: "DELETE" });
            fetchNotices();
          } catch { btn.disabled = false; alert("削除できませんでした"); }
        };
      });
    } catch {
      $("noticeList").innerHTML = '<p class="hint">取得できませんでした。</p>';
    }
  }

  // ── 意見箱 ──
  $("fetchFeedback").onclick = fetchFeedback;
  $("fbFilter").onchange = fetchFeedback;
  async function fetchFeedback() {
    try {
      const d = await (await fetch("/api/user-feedback")).json();
      let items = d.feedbacks || [];
      const f = $("fbFilter").value;
      if (f === "未読のみ") items = items.filter(x => !x.read);
      else if (f !== "すべて") items = items.filter(x => x.category === f);
      $("feedbackList").innerHTML = items.length
        ? items.map(x => `
          <div class="fb-item ${x.read ? "" : "unread"}">
            <div class="fb-header">
              <span class="fb-cat">${esc(x.category || "その他")}</span>
              ${!x.read ? '<span class="fb-new">未読</span>' : ""}
              <span style="font-size:13px;font-weight:700">${esc(x.senderName || "匿名")}</span>
            </div>
            <p class="fb-msg">${esc(x.message)}</p>
            <div class="fb-footer">
              <small>${fmtDate(x.sentAt)}</small>
              <div class="row">
                ${!x.read ? `<button class="secondary sm-btn" data-fb-read="${esc(x.id)}">既読</button>` : ""}
                <button class="danger sm-btn" data-fb-del="${esc(x.id)}">削除</button>
              </div>
            </div>
          </div>`).join("")
        : '<p class="hint">意見はありません。</p>';
      document.querySelectorAll("[data-fb-read]").forEach(btn => {
        btn.onclick = async () => {
          btn.disabled = true;
          try {
            const res = await fetch(`/api/user-feedback?id=${encodeURIComponent(btn.dataset.fbRead)}`, { method: "PATCH" });
            if (!res.ok) throw new Error();
            fetchFeedback();
          } catch { btn.disabled = false; alert("既読処理に失敗しました"); }
        };
      });
      document.querySelectorAll("[data-fb-del]").forEach(btn => {
        btn.onclick = async () => {
          if (!confirm("この意見を削除しますか？")) return;
          btn.disabled = true;
          try {
            await fetch(`/api/user-feedback?id=${encodeURIComponent(btn.dataset.fbDel)}`, { method: "DELETE" });
            fetchFeedback();
          } catch { btn.disabled = false; alert("削除できませんでした"); }
        };
      });
    } catch {
      $("feedbackList").innerHTML = '<p class="hint">取得できませんでした。</p>';
    }
  }

  // ── 初期化 ──
  render();
  showTab(location.hash || "#home");
  fetchNotices();
  fetchFeedback();
</script>
</body>
</html>
