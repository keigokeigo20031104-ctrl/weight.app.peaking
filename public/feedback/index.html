<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>意見箱 — 管理</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f2;margin:0;color:#17211f}.app{max-width:900px;margin:auto;padding:18px 12px}.card{background:white;border:1px solid #d8dfdb;border-radius:18px;padding:14px;margin:10px 0}button,select{font:inherit;border-radius:10px;padding:9px}button{border:0;background:#176b5d;color:white;font-weight:800}.row{display:flex;gap:8px;flex-wrap:wrap}.item{border-bottom:1px solid #d8dfdb;padding:10px 0}.muted{color:#65726e}a{color:#176b5d}</style></head><body><div class="app"><a href="/">← トップへ戻る</a><h1>意見箱</h1><div class="card"><div class="row"><button id="reload">再読み込み</button><select id="filter"><option>すべて</option><option>バグ報告</option><option>機能要望</option><option>その他</option><option>未読のみ</option></select></div><div id="list" class="muted">読み込み中…</div></div></div><script>
const $=id=>document.getElementById(id);async function load(){try{const d=await (await fetch("/api/user-feedback")).json();let items=d.feedbacks||[];const f=$("filter").value;if(f==="未読のみ")items=items.filter(x=>!x.read);else if(f!=="すべて")items=items.filter(x=>x.category===f);$("list").innerHTML=items.map(x=>`<div class="item"><b>${x.category}</b> ${x.senderName||"匿名"} ${x.read?"既読":"未読"}<p>${x.message}</p><small>${x.sentAt}</small><br><button data-read="${x.id}">既読</button> <button data-del="${x.id}">削除</button></div>`).join("")||"なし";document.querySelectorAll("[data-read]").forEach(b=>b.onclick=async()=>{await fetch("/api/user-feedback?id="+encodeURIComponent(b.dataset.read),{method:"PATCH"});load()});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{await fetch("/api/user-feedback?id="+encodeURIComponent(b.dataset.del),{method:"DELETE"});load()});}catch(e){$("list").textContent="取得できませんでした"}}
$("reload").onclick=load;$("filter").onchange=load;load();
</script></body></html>
